spring.application.name=mandateguard

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/mandateguard_db}
spring.datasource.username=${DB_USERNAME:mandateguard_user}
spring.datasource.password=${DB_PASSWORD:mandateguard_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
management.endpoints.web.exposure.include=health,info

server.port=${PORT:8080}
mandateguard.jwt.secret=${JWT_SECRET}
mandateguard.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}