spring.application.name=mandateguard

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/mandateguard_db}
spring.datasource.username=${DB_USERNAME:mandateguard_user}
spring.datasource.password=${DB_PASSWORD:mandateguard_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info

server.port=${PORT:8080}