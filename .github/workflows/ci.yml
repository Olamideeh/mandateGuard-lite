name: MandateGuard CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_DB: mandateguard_db
          POSTGRES_USER: mandateguard_user
          POSTGRES_PASSWORD: mandateguard_password

        ports:
          - 5436:5432

        options: >-
          --health-cmd "pg_isready -U mandateguard_user -d mandateguard_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5436/mandateguard_db
      DB_USERNAME: mandateguard_user
      DB_PASSWORD: mandateguard_password
      JWT_SECRET: mandateguard-ci-jwt-secret-longer-than-32-bytes
      JWT_EXPIRATION_MINUTES: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and run tests
        run: ./mvnw --batch-mode clean verify