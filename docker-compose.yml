services:
  postgres:
    image: postgres:16-alpine
    container_name: mandateguard-postgres
    environment:
      POSTGRES_DB: mandateguard_db
      POSTGRES_USER: mandateguard_user
      POSTGRES_PASSWORD: mandateguard_password
    ports:
      - "5436:5432"
    volumes:
      - mandateguard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U mandateguard_user -d mandateguard_db
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: mandateguard-app

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/mandateguard_db
      DB_USERNAME: mandateguard_user
      DB_PASSWORD: mandateguard_password
      JWT_SECRET: ${JWT_SECRET:-mandateguard-local-docker-secret-change-this-123456}
      JWT_EXPIRATION_MINUTES: 60
      PORT: 8080
      SPRING_PROFILES_ACTIVE: prod

    ports:
      - "8080:8080"

    restart: unless-stopped
  adminer:
    image: adminer:latest
    container_name: mandateguard-adminer
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  mandateguard_postgres_data:
